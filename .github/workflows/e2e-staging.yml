name: Staging E2E

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Staging URL to test
        required: false
        default: https://stc-productivity-staging.vercel.app

permissions:
  contents: read

concurrency:
  group: staging-e2e-${{ github.event.deployment.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.ref == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || 'https://stc-productivity-staging.vercel.app' }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || 'staging' }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned E2E runner
        run: npm install --prefix e2e --no-audit --no-fund

      - name: Install Chromium
        run: npm --prefix e2e run install:chromium

      - name: Run browser E2E
        run: npm --prefix e2e test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
